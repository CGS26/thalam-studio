name: Bug report
description: Report a reproducible problem in Tāla Lab
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome 130, Android 15"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Do not attach private audio or personal information.
